# ============================================================================
# SMARTSHOP – SPRING BOOT APPLICATION CONFIGURATION
# AICTE Smart India Hackathon 2026
# ============================================================================

server.port=8080

# Spring Application Name
spring.application.name=SmartShop

# ============================================================================
# MYSQL DATASOURCE CONFIGURATION (Production / Local MySQL Instance)
# ============================================================================
# To connect to your local MySQL, ensure MySQL server is running and database
# 'smartshop_db' exists (or execute database/smartshop.sql), then uncomment below:

spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================================
# H2 IN-MEMORY DATABASE FALLBACK (If MySQL is not installed or offline)
# To use H2 in-memory instead, change the profile or use:
# spring.datasource.url=jdbc:h2:mem:smartshop_db;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# ============================================================================

# Logging
logging.level.com.smartshop=DEBUG
logging.level.org.springframework.web=INFO
