# ============================================================================
# SMARTSHOP – SPRING BOOT APPLICATION CONFIGURATION
# AICTE Smart India Hackathon 2026
# ============================================================================

# Server port
# Render provides the PORT environment variable.
# 8080 is used when running locally.
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=SmartShop


# ============================================================================
# MYSQL DATASOURCE CONFIGURATION
# Aiven MySQL (Production) / Environment Variables
# ============================================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ============================================================================
# LOGGING
# ============================================================================

logging.level.com.smartshop=INFO
logging.level.org.springframework.web=INFO