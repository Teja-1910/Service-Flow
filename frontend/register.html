<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SmartShop – Unified Marketplace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg smart-navbar">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <div class="brand-logo-icon">
          <i class="fas fa-bag-shopping"></i>
        </div>
        <div>
          <div>Smart<span class="brand-highlight">Shop</span></div>
          <span class="brand-subtag">Smart Shopping For A Better Tomorrow</span>
        </div>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Register Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="p-4 p-sm-5 bg-white">
            
            <div class="text-center mb-4">
              <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-1 rounded-pill mb-2">
                🎁 +500 Reward Points Sign-up Bonus
              </span>
              <h3 class="fw-bold text-dark">Create Your Account</h3>
              <p class="text-muted small">Join India's unified smart marketplace for retail, travel & entertainment</p>
            </div>

            <!-- Error message container -->
            <div id="registerAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label for="regName" class="form-label small fw-bold text-dark">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-user"></i></span>
                  <input type="text" class="form-control bg-light border-start-0 ps-0" id="regName" placeholder="e.g. Aarav Sharma" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="regEmail" class="form-label small fw-bold text-dark">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0 ps-0" id="regEmail" placeholder="aarav@example.com" required>
                  </div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regMobile" class="form-label small fw-bold text-dark">Mobile (10 Digits)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted">+91</span>
                    <input type="tel" class="form-control bg-light border-start-0 ps-0" id="regMobile" placeholder="9876543210" pattern="[0-9]{10}" required>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="regPassword" class="form-label small fw-bold text-dark">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0 ps-0" id="regPassword" placeholder="Min 6 chars" minlength="6" required>
                  </div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regConfirmPassword" class="form-label small fw-bold text-dark">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-shield-check"></i></span>
                    <input type="password" class="form-control bg-light border-start-0 ps-0" id="regConfirmPassword" placeholder="Re-type password" required>
                  </div>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                <label class="form-check-label small text-muted" for="termsCheck">
                  I agree to the SmartShop Terms of Service & Privacy Policy
                </label>
              </div>

              <button type="submit" class="btn btn-smart-primary w-100 justify-content-center py-2 mb-3">
                <i class="fas fa-user-plus me-2"></i> Register & Earn 500 Pts
              </button>
            </form>

            <div class="text-center small text-muted">
              Already have an account? 
              <a href="login.html" class="text-primary fw-bold">Sign In Here</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
