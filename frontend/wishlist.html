<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | SmartShop</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <div class="brand-logo-icon">
          <i class="fas fa-bag-shopping"></i>

        <div>
          <div>Smart<span class="brand-highlight">Shop</span></div>
          <span class="brand-subtag">Smart Shopping For A Better Tomorrow</span>
        </div>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#smartNavMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="smartNavMenu">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Retail</a></li>
          <li class="nav-item"><a class="nav-link" href="hotels.html">Hospitality</a></li>
          <li class="nav-item"><a class="nav-link" href="entertainment.html">Entertainment</a></li>
          <li class="nav-item"><a class="nav-link" href="finance.html">Finance</a></li>
          <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="wishlist.html" class="nav-action-btn active" title="Saved Items">
            <i class="fas fa-heart text-danger"></i>
            <span class="badge-counter" id="wishlistBadge" style="display: none;">0</span>
          </a>
          <a href="cart.html" class="nav-action-btn" title="Shopping Bag">
            <i class="fas fa-shopping-bag"></i>
            <span class="badge-counter" id="cartBadge" style="display: none;">0</span>
          </a>
          <div id="userNavContainer"></div>
        </div>
      </div>
    </div>

      <div>
        <h2 class="fw-bold mb-1">My Saved Wishlist</h2>
        <p class="text-muted small mb-0" id="wishlistCountText">Loading saved items...</p>
      </div>
      <a href="products.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">
        <i class="fas fa-plus me-1"></i> Add More Items
      </a>
    </div>

    <!-- Wishlist Grid -->
    <div class="row g-4" id="wishlistItemsGrid">
      <!-- Injected by wishlist.js -->

  <footer class="smart-footer">
