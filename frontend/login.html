<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SmartShop – Unified Marketplace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg smart-navbar">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <div class="brand-logo-icon">
          <i class="fas fa-bag-shopping"></i>
        </div>
        <div>
          <div>Smart<span class="brand-highlight">Shop</span></div>
          <span class="brand-subtag">Smart Shopping For A Better Tomorrow</span>
        </div>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="p-4 p-sm-5 bg-white">
            
            <div class="text-center mb-4">
              <div class="brand-logo-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.4rem;">
                <i class="fas fa-user-lock"></i>
              </div>
              <h3 class="fw-bold text-dark">Welcome Back</h3>
              <p class="text-muted small">Sign in to access your unified cart, wallet, and rewards</p>
            </div>

            <!-- Error message container -->
            <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-bold text-dark">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control bg-light border-start-0 ps-0" id="loginEmail" placeholder="e.g. customer@smartshop.com" required>
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label small fw-bold text-dark mb-0">Password</label>
                  <a href="javascript:void(0)" onclick="showToast('Password Reset', 'In this hackathon prototype, use demo credentials below.', 'info')" class="text-primary small">Forgot password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                  <input type="password" class="form-control bg-light border-start-0 ps-0" id="loginPassword" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" class="btn btn-smart-primary w-100 justify-content-center py-2 mb-3">
                <i class="fas fa-right-to-bracket me-2"></i> Sign In
              </button>
            </form>

            <!-- Quick One-Click Demo Logins for Hackathon Evaluator -->
            <div class="p-3 bg-light rounded-3 border mb-4">
              <div class="text-center text-muted small fw-bold mb-2">
                <i class="fas fa-bolt text-warning me-1"></i> Quick Demo Login (One-Click)
              </div>
              <div class="row g-2">
                <div class="col-6">
                  <button type="button" class="btn btn-outline-primary btn-sm w-100 rounded-pill fw-bold" onclick="quickDemoLogin('customer')">
                    <i class="fas fa-user me-1"></i> Customer Demo
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-danger btn-sm w-100 rounded-pill fw-bold" onclick="quickDemoLogin('admin')">
                    <i class="fas fa-shield-alt me-1"></i> Admin Demo
                  </button>
                </div>
              </div>
            </div>

            <div class="text-center small text-muted">
              Don't have an account yet? 
              <a href="register.html" class="text-primary fw-bold">Sign Up & Get +500 Pts</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
