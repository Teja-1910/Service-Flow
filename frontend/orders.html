  <style>
    /* Stepper UI */
    .stepper-wrapper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-bottom: 20px;
    }
    .stepper-wrapper::before {
      content: '';
      position: absolute;
      top: 24px;
      left: 10%;
      right: 10%;
      height: 4px;
      background: #e2e8f0;
      z-index: 1;
    }
    .stepper-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      z-index: 2;
    }
    .step-counter {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-sm);
    }
    .stepper-item.completed .step-counter {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }
    .step-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
    }
    .stepper-item.completed .step-name {
      color: var(--primary);
    }
  </style>
</head>
